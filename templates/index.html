<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <title>LinguaAI - Language Translation Tool</title>

</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">

            <h1>🌐 LinguaAI</h1>

            <p>
                AI-Powered Multilingual Translation Tool
            </p>

        </div>


        <!-- LANGUAGE SELECTION -->
        <div class="language-section">

            <!-- SOURCE LANGUAGE -->
            <div class="language-box">

                <label for="sourceLanguage">
                    Source Language
                </label>

                <select id="sourceLanguage">

                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="bn">Bengali</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="ar">Arabic</option>
                    <option value="zh">Chinese</option>

                </select>

            </div>


            <!-- SWAP BUTTON -->
            <div class="swap-container">

                <button
                    class="swap-btn"
                    id="swapBtn"
                    onclick="swapLanguages()"
                    title="Swap languages">

                    ⇄

                </button>

            </div>


            <!-- TARGET LANGUAGE -->
            <div class="language-box">

                <label for="targetLanguage">
                    Target Language
                </label>

                <select id="targetLanguage">

                    <option value="hi">Hindi</option>
                    <option value="en">English</option>
                    <option value="bn">Bengali</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="ar">Arabic</option>
                    <option value="zh">Chinese</option>

                </select>

            </div>

        </div>


        <!-- TRANSLATOR -->
        <div class="translator-section">

            <!-- INPUT -->
            <div class="text-box">

                <label for="inputText">
                    📝 Enter Text
                </label>

                <textarea
                    id="inputText"
                    placeholder="Type or paste your text here..."
                    maxlength="5000"></textarea>

                <div class="character-count">
                    Characters: <span id="charCount">0</span> / 5000
                </div>

            </div>


            <!-- OUTPUT -->
            <div class="text-box">

                <label for="outputText">
                    🌍 Translation
                </label>

                <textarea
                    id="outputText"
                    placeholder="Your translation will appear here..."
                    readonly></textarea>

                <button
                    class="copy-btn"
                    onclick="copyTranslation()">

                    📋 Copy Translation

                </button>

            </div>

        </div>


        <!-- TRANSLATE BUTTON -->
        <button
            class="translate-btn"
            id="translateBtn"
            onclick="translateText()">

            🔄 Translate

        </button>


        <!-- CLEAR BUTTON -->
        <button
            class="clear-btn"
            onclick="clearText()">

            🗑️ Clear

        </button>


        <!-- STATUS -->
        <div id="status"></div>


        <!-- FOOTER -->
        <div class="footer">

            <p>
                LinguaAI • Built with Python Flask & REST API
            </p>

        </div>

    </div>


    <!-- EXTERNAL JAVASCRIPT -->
    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
