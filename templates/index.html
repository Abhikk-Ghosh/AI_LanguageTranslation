            <!-- INPUT -->
            <div class="text-box">

                <label for="inputText">
                    📝 Enter Text
                </label>

                <textarea
                    id="inputText"
                    placeholder="Type or paste your text here..."
                    maxlength="5000"></textarea>

                <div class="character-count">
                    Characters:
                    <span id="charCount">0</span> / 5000
                </div>

            </div>


            <!-- OUTPUT -->
            <div class="text-box">

                <label for="outputText">
                    🌍 Translation
                </label>

                <textarea
                    id="outputText"
                    placeholder="Your translation will appear here..."
                    readonly></textarea>

                <button
                    class="copy-btn"
                    onclick="copyTranslation()">

                    📋 Copy Translation

                </button>

            </div>

        </div>


        <!-- TRANSLATE BUTTON -->
        <button
            class="translate-btn"
            id="translateBtn"
            onclick="translateText()">

            🔄 Translate

        </button>


        <!-- CLEAR BUTTON -->
        <button
            class="clear-btn"
            onclick="clearText()">

            🗑️ Clear

        </button>


        <!-- STATUS -->
